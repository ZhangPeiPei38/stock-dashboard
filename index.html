<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自选股行情看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "Microsoft YaHei", sans-serif; }
        body { background: #f5f5f5; padding: 12px; color: #333; }
        .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .title { font-size: 18px; font-weight: bold; margin-bottom: 12px; border-left: 4px solid #e53935; padding-left: 8px; }
        .index-container { display: flex; gap: 12px; flex-wrap: wrap; }
        .index-item { flex: 1; min-width: 140px; padding: 12px; border-radius: 6px; text-align: center; background: #fafafa; }
        .index-name { font-size: 14px; color: #666; margin-bottom: 6px; }
        .index-price { font-size: 20px; font-weight: bold; }
        .index-change { font-size: 14px; margin-top: 4px; }
        .up { color: #e53935; }
        .down { color: #2e7d32; }
        .flat { color: #333; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid #eee; }
        th:first-child, td:first-child { text-align: left; }
        th { background: #fafafa; font-weight: normal; color: #666; }
        .stock-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tab-btn { padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
        .tab-btn.active { background: #e53935; color: #fff; border-color: #e53935; }
        #klineChart { width: 100%; height: 300px; }
        .table-wrap { overflow-x: auto; }
        .pagination { display: flex; gap: 8px; justify-content: center; margin-top: 12px; align-items: center; }
        .page-btn { padding: 4px 12px; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: pointer; font-size: 14px; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-info { font-size: 14px; color: #666; }
        
        /* 手机端适配 */
        @media (max-width: 768px) {
            body { padding: 8px; }
            .card { padding: 12px; margin-bottom: 8px; }
            .title { font-size: 16px; }
            .index-container { gap: 8px; }
            .index-item { min-width: 120px; padding: 8px; }
            .index-price { font-size: 18px; }
            .index-change { font-size: 12px; }
            .stock-tabs { gap: 4px; }
            .tab-btn { padding: 4px 8px; font-size: 12px; }
            table { font-size: 12px; }
            th, td { padding: 6px 4px; }
            #klineChart { height: 250px; }
        }
    </style>
</head>
<body>
    <!-- 大盘指数板块 -->
    <div class="card">
        <div class="title">沪深大盘</div>
        <div class="index-container">
            <div class="index-item">
                <div class="index-name">上证指数</div>
                <div class="index-price" id="shPrice">--</div>
                <div class="index-change" id="shChange">--</div>
            </div>
            <div class="index-item">
                <div class="index-name">深证成指</div>
                <div class="index-price" id="szPrice">--</div>
                <div class="index-change" id="szChange">--</div>
            </div>
        </div>
    </div>

    <!-- 个股行情板块 -->
    <div class="card">
        <div class="title">自选股行情</div>
        <div class="stock-tabs" id="stockTabs"></div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>收盘价</th>
                        <th>开盘价</th>
                        <th>最高价</th>
                        <th>最低价</th>
                        <th>涨跌额</th>
                        <th>涨跌幅</th>
                    </tr>
                </thead>
                <tbody id="stockTable"></tbody>
            </table>
        </div>
        <div class="pagination" id="pagination">
            <button class="page-btn" id="prevPage">上一页</button>
            <span class="page-info" id="pageInfo"></span>
            <button class="page-btn" id="nextPage">下一页</button>
        </div>
    </div>

    <!-- K线图板块 -->
    <div class="card">
        <div class="title">大盘指数走势 <span id="indexChangeDisplay" style="font-size:14px; font-weight:normal; margin-left:12px;"></span></div>
        <div class="stock-tabs" id="indexTabs">
            <button class="tab-btn active" data-index="sh">上证指数</button>
            <button class="tab-btn" data-index="sz">深证成指</button>
        </div>
        <div id="klineChart"></div>
    </div>

    <!-- 日历热力图板块 -->
    <div class="card">
        <div class="title">指数涨跌日历 <span style="font-size:12px; font-weight:normal; margin-left:12px; color:#666;">(红=涨幅≥0.8%  绿=跌幅≤-0.8%)</span></div>
        <div id="calendarChart" style="width: 100%; height: 280px;"></div>
    </div>

    <script>
        // 自选股配置 - 55只股票
        const stockList = [
            { code: 'sh600722', name: '金牛化工' },
            { code: 'sh600378', name: '昊华科技' },
            { code: 'sh600096', name: '云天化' },
            { code: 'sh600343', name: '航天动力' },
            { code: 'sh600900', name: '长江电力' },
            { code: 'sh601330', name: '绿色动力' },
            { code: 'sz002428', name: '云南锗业' },
            { code: 'sh688160', name: '步科股份' },
            { code: 'sh688392', name: '骄成超声' },
            { code: 'sh600348', name: '华阳股份' },
            { code: 'sz002348', name: '高乐股份' },
            { code: 'sh600105', name: '永鼎股份' },
            { code: 'sh603259', name: '药明康德' },
            { code: 'sh605123', name: '派克新材' },
            { code: 'sz001337', name: '四川黄金' },
            { code: 'sz002142', name: '宁波银行' },
            { code: 'sz002979', name: '雷赛智能' },
            { code: 'sh603906', name: '龙蟠科技' },
            { code: 'sh601838', name: '成都银行' },
            { code: 'sz002938', name: '鹏鼎控股' },
            { code: 'sz002980', name: '华盛昌' },
            { code: 'sz002916', name: '深南电路' },
            { code: 'sh603773', name: '沃格光电' },
            { code: 'sh603618', name: '杭电股份' },
            { code: 'sz000938', name: '紫光股份' },
            { code: 'sz002430', name: '杭氧股份' },
            { code: 'sz002463', name: '沪电股份' },
            { code: 'sz002008', name: '大族激光' },
            { code: 'sh600176', name: '中国巨石' },
            { code: 'sh600703', name: '三安光电' },
            { code: 'sz002384', name: '东山精密' },
            { code: 'sh600498', name: '烽火通信' },
            { code: 'sh600487', name: '亨通光电' },
            { code: 'sz000547', name: '航天发展' },
            { code: 'sz002371', name: '北方华创' },
            { code: 'sz002792', name: '通宇通讯' },
            { code: 'sz002413', name: '雷科防务' },
            { code: 'sz002049', name: '紫光国微' },
            { code: 'sz000988', name: '华工科技' },
            { code: 'sh600276', name: '恒瑞医药' },
            { code: 'sh605099', name: '共创草坪' },
            { code: 'sh601899', name: '紫金矿业' },
            { code: 'sz000831', name: '中国稀土' },
            { code: 'sh603459', name: '红板科技' },
            { code: 'sh601138', name: '工业富联' },
            { code: 'sh601857', name: '中国石油' },
            { code: 'sh601869', name: '长飞光纤' },
            { code: 'sh600938', name: '中国海油' },
            { code: 'sh600584', name: '长电科技' },
            { code: 'sh600118', name: '中国卫星' },
            { code: 'sh600406', name: '国电南瑞' },
            { code: 'sh600268', name: '国电南自' },
            { code: 'sh600879', name: '航天电子' },
            { code: 'sz002738', name: '中矿资源' },
            { code: 'sh600362', name: '江西铜业' },
        ];
        let currentStock = stockList[0];
        let currentIndex = 'sh';
        let klineChart = echarts.init(document.getElementById('klineChart'));
        let calendarChart = echarts.init(document.getElementById('calendarChart'));
        let allData = null; // 存储从data.json读取的全部数据
        let currentStockData = null; // 当前选中股票的数据
        let currentPage = 1; // 当前页码
        const pageSize = 40; // 每页显示条数（约两个月）

        // 从本地data.json加载全部数据
        async function loadAllData() {
            try {
                const response = await fetch('data.json');
                allData = await response.json();
                // 渲染大盘指数
                renderIndexDisplay();
                renderIndexKline();
                // 渲染当前选中个股
                loadStockData(currentStock);
            } catch (e) {
                console.error('加载数据失败:', e);
            }
        }

        // 渲染大盘指数显示
        function renderIndexDisplay() {
            if (!allData || !allData.indexes) return;
            allData.indexes.forEach(idx => {
                const code = idx.code;
                const last = idx.kline[idx.kline.length - 1];
                const isUp = idx.change >= 0;
                if (code === 'sh000001') {
                    document.getElementById('shPrice').textContent = idx.price.toFixed(2);
                    document.getElementById('shChange').textContent = `${last.day}  ${isUp ? '+' : ''}${idx.change}  ${isUp ? '+' : ''}${idx.change_pct}%`;
                    document.getElementById('shChange').className = `index-change ${isUp ? 'up' : 'down'}`;
                } else if (code === 'sz399001') {
                    document.getElementById('szPrice').textContent = idx.price.toFixed(2);
                    document.getElementById('szChange').textContent = `${last.day}  ${isUp ? '+' : ''}${idx.change}  ${isUp ? '+' : ''}${idx.change_pct}%`;
                    document.getElementById('szChange').className = `index-change ${isUp ? 'up' : 'down'}`;
                }
            });
        }

        // 渲染大盘指数K线
        function renderIndexKline() {
            if (!allData || !allData.indexes) return;
            const idxCode = currentIndex === 'sh' ? 'sh000001' : 'sz399001';
            const idx = allData.indexes.find(i => i.code === idxCode);
            if (!idx) return;
            const data = idx.kline;
            const dates = [];
            const klineData = [];
            for (let i = data.length - 1; i >= 0; i--) {
                const item = data[i];
                dates.unshift(item.day);
                klineData.unshift([parseFloat(item.open), parseFloat(item.close), parseFloat(item.low), parseFloat(item.high)]);
            }
            // 更新标题旁边的涨跌百分比显示
            const isUp = idx.change >= 0;
            const display = document.getElementById('indexChangeDisplay');
            display.textContent = `${isUp ? '+' : ''}${idx.change}  ${isUp ? '+' : ''}${idx.change_pct}%`;
            display.className = isUp ? 'up' : 'down';
            
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross' },
                    formatter: function(params) {
                        const dataIndex = params[0].dataIndex;
                        const item = data[data.length - 1 - dataIndex];
                        const prevClose = dataIndex > 0 ? parseFloat(data[data.length - dataIndex].close) : parseFloat(item.open);
                        const open = parseFloat(item.open);
                        const close = parseFloat(item.close);
                        const high = parseFloat(item.high);
                        const low = parseFloat(item.low);
                        const change = (close - prevClose).toFixed(2);
                        const changePct = ((close - prevClose) / prevClose * 100).toFixed(2);
                        const color = change >= 0 ? '#e53935' : '#2e7d32';
                        const sign = change >= 0 ? '+' : '';
                        return `<div style="font-size:12px;">
                            <div style="font-weight:bold; margin-bottom:4px;">${item.day}</div>
                            <div>开盘：${open.toFixed(2)}</div>
                            <div>收盘：${close.toFixed(2)}</div>
                            <div>最高：${high.toFixed(2)}</div>
                            <div>最低：${low.toFixed(2)}</div>
                            <div style="color:${color}; margin-top:4px;">涨跌：${sign}${change}  ${sign}${changePct}%</div>
                        </div>`;
                    }
                },
                grid: { left: '10%', right: '5%', bottom: '10%' },
                xAxis: { type: 'category', data: dates, axisLabel: { fontSize: 10 } },
                yAxis: { type: 'value', scale: true, axisLabel: { fontSize: 10 } },
                series: [{
                    name: currentIndex === 'sh' ? '上证指数' : '深证成指',
                    type: 'candlestick',
                    data: klineData,
                    itemStyle: {
                        color: '#e53935',
                        color0: '#2e7d32',
                        borderColor: '#e53935',
                        borderColor0: '#2e7d32'
                    }
                }]
            };
            klineChart.setOption(option, true);
            renderCalendar();
        }

        // 渲染日历热力图
        function renderCalendar() {
            if (!allData || !allData.indexes) return;
            const idxCode = currentIndex === 'sh' ? 'sh000001' : 'sz399001';
            const idx = allData.indexes.find(i => i.code === idxCode);
            if (!idx) return;
            
            const data = idx.kline;
            const calendarData = [];
            for (let i = 0; i < data.length; i++) {
                const item = data[i];
                const prevClose = i > 0 ? parseFloat(data[i-1].close) : parseFloat(item.open);
                const close = parseFloat(item.close);
                const changePct = ((close - prevClose) / prevClose * 100).toFixed(2);
                calendarData.push([item.day, parseFloat(changePct)]);
            }
            
            // 获取日期范围
            const startDate = calendarData[0][0];
            const endDate = calendarData[calendarData.length - 1][0];
            
            const option = {
                tooltip: {
                    formatter: function(params) {
                        const color = params.value[1] >= 0 ? '#e53935' : '#2e7d32';
                        const sign = params.value[1] >= 0 ? '+' : '';
                        return `<div style="font-size:12px;">
                            <div style="font-weight:bold;">${params.value[0]}</div>
                            <div style="color:${color};">涨跌幅：${sign}${params.value[1]}%</div>
                        </div>`;
                    }
                },
                visualMap: {
                    min: -3,
                    max: 3,
                    show: true,
                    orient: 'horizontal',
                    left: 'center',
                    bottom: 0,
                    inRange: {
                        color: ['#00c853', '#69f0ae', '#ff5252', '#d50000']
                    },
                    textStyle: { fontSize: 10 }
                },
                calendar: {
                    top: 40,
                    left: 20,
                    right: 20,
                    cellSize: ['auto', 26],
                    range: [startDate, endDate],
                    orient: 'horizontal',
                    monthAlign: 'left',
                    dayAlign: 'left',
                    itemStyle: {
                        borderWidth: 0.5,
                        borderColor: '#eee'
                    },
                    dayLabel: {
                        firstDay: 0,
                        nameMap: ['周日', '周一', '周二', '周三', '周四', '周五', '周六'],
                        fontSize: 11,
                        color: '#333',
                        position: 'start'
                    },
                    monthLabel: {
                        nameMap: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
                        fontSize: 12,
                        color: '#333',
                        fontWeight: 'bold'
                    },
                    yearLabel: { show: false }
                },
                series: [{
                    type: 'heatmap',
                    coordinateSystem: 'calendar',
                    data: calendarData
                }]
            };
            calendarChart.setOption(option, true);
        }

        // 加载个股日线数据（从本地data.json读取）
        function loadStockData(stock) {
            if (!allData || !allData.stocks) return;
            const stockData = allData.stocks.find(s => s.code === stock.code);
            if (!stockData) return;
            currentStockData = stockData;
            // 默认显示最新的一页（最后一页），这样第一页最下面就是最新日期
            const totalPages = Math.ceil(stockData.kline.length / pageSize);
            currentPage = totalPages;
            renderStockTable();
        }

        // 渲染股票表格（分页）
        function renderStockTable() {
            if (!currentStockData) return;
            const data = currentStockData.kline;
            // data是从旧到新排序的，我们也按这个顺序显示：最旧的在上面，最新的在下面
            const totalPages = Math.ceil(data.length / pageSize);
            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, data.length);
            const pageData = data.slice(start, end);

            // 渲染表格
            let tableHtml = '';
            for (let i = 0; i < pageData.length; i++) {
                const item = pageData[i];
                // 找到当前数据在完整数组中的索引，用于获取上一个交易日的收盘价
                const globalIndex = start + i;
                const prevClose = globalIndex > 0 ? parseFloat(data[globalIndex - 1].close) : parseFloat(item.open);
                
                const open = parseFloat(item.open);
                const high = parseFloat(item.high);
                const low = parseFloat(item.low);
                const close = parseFloat(item.close);
                const change = item.change || 0;
                const changePct = item.change_pct || 0;
                
                // 收盘价颜色：和上一个交易日收盘价对比
                let closeColor = 'flat';
                if (change > 0) closeColor = 'up';
                else if (change < 0) closeColor = 'down';
                
                // 开盘价颜色：和上一个交易日收盘价对比
                let openColor = 'flat';
                if (open > prevClose) openColor = 'up';
                else if (open < prevClose) openColor = 'down';
                
                // 最高价颜色：和上一个交易日收盘价对比
                let highColor = 'flat';
                if (high > prevClose) highColor = 'up';
                else if (high < prevClose) highColor = 'down';
                
                // 最低价颜色：和上一个交易日收盘价对比
                let lowColor = 'flat';
                if (low > prevClose) lowColor = 'up';
                else if (low < prevClose) lowColor = 'down';
                
                tableHtml += `<tr>
                    <td>${item.day}</td>
                    <td class="${closeColor}">${close.toFixed(2)}</td>
                    <td class="${openColor}">${open.toFixed(2)}</td>
                    <td class="${highColor}">${high.toFixed(2)}</td>
                    <td class="${lowColor}">${low.toFixed(2)}</td>
                    <td class="${closeColor}">${change > 0 ? '+' : ''}${change.toFixed(2)}</td>
                    <td class="${closeColor}">${change > 0 ? '+' : ''}${changePct.toFixed(2)}%</td>
                </tr>`;
            }
            document.getElementById('stockTable').innerHTML = tableHtml;

            // 渲染分页
            document.getElementById('pageInfo').textContent = `第 ${currentPage} / ${totalPages} 页`;
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
        }

        // 生成股票切换标签
        function initTabs() {
            const tabs = document.getElementById('stockTabs');
            stockList.forEach((stock, idx) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${idx === 0 ? 'active' : ''}`;
                btn.textContent = stock.name;
                btn.onclick = () => {
                    document.querySelectorAll('#stockTabs .tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentStock = stock;
                    loadStockData(stock);
                };
                tabs.appendChild(btn);
            });
        }

        // 初始化大盘指数标签切换
        function initIndexTabs() {
            const tabs = document.querySelectorAll('#indexTabs .tab-btn');
            tabs.forEach(btn => {
                btn.onclick = () => {
                    tabs.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentIndex = btn.dataset.index;
                    renderIndexKline();
                };
            });
        }

        // 初始化
        window.onload = () => {
            loadAllData();
            initTabs();
            initIndexTabs();
            // 分页按钮事件
            document.getElementById('prevPage').onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderStockTable();
                }
            };
            document.getElementById('nextPage').onclick = () => {
                if (currentPage < Math.ceil(currentStockData.kline.length / pageSize)) {
                    currentPage++;
                    renderStockTable();
                }
            };
            window.addEventListener('resize', () => {
                klineChart.resize();
                calendarChart.resize();
            });
        };
    </script>
</body>
</html>
